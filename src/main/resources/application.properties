spring.application.name=yousong-backend

# Load local secrets from .env (git-ignored); real environment variables still win
spring.config.import=optional:file:.env[.properties]

# Database (override with environment variables; defaults match docker-compose.yml)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the schema; Hibernate only validates it
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Instants are stored in UTC; the UI renders America/Bogota
spring.jackson.time-zone=UTC

# Security: this backend is a stateless OAuth2 resource server. Staff log in against FusionAuth;
# access tokens are verified with its public keys (JWKS), so no signing secret lives here.
# The issuer is just the tenant's "issuer" setting, not the address of the server, so OIDC discovery is not used.
# FusionAuth 1.70.x ships the default tenant with https://example.com; change both in production.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${FUSIONAUTH_JWKS_URI:http://localhost:9011/.well-known/jwks.json}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${FUSIONAUTH_ISSUER:https://example.com}
# Audience = id of the FusionAuth application (same value as in fusionauth/kickstart/kickstart.json)
spring.security.oauth2.resourceserver.jwt.audiences=${FUSIONAUTH_APPLICATION_ID:c2f6a1b4-3d5e-4f70-8a9b-6e1d2c3b4a59}

# Public address of the client app that QR codes point to (https in production)
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:3000}

# Browser origins allowed to call the API (comma separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management.endpoints.web.exposure.include=health,info

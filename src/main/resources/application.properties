spring.application.name=yousong-backend

# Database (override with environment variables; defaults match docker-compose.yml)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nuclear_vii}
spring.datasource.username=${DB_USER:nuclear}
spring.datasource.password=${DB_PASSWORD:nuclear}

# Flyway owns the schema; Hibernate only validates it
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Instants are stored in UTC; the UI renders America/Bogota
spring.jackson.time-zone=UTC

# JWT (never commit a real secret; set JWT_SECRET in each environment)
app.security.jwt.secret=${JWT_SECRET:change-me-in-every-environment-min-32-bytes!!}

management.endpoints.web.exposure.include=health,info

spring.application.name=yousong-backend

# Load local secrets from .env (git-ignored); real environment variables still win
spring.config.import=optional:file:.env[.properties]

# Database (override with environment variables; defaults match docker-compose.yml)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the schema; Hibernate only validates it
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Instants are stored in UTC; the UI renders America/Bogota
spring.jackson.time-zone=UTC

# Security: this backend is a stateless OAuth2 resource server. Staff log in against FusionAuth;
# access tokens are verified with its public keys (JWKS), so no signing secret lives here.
# The issuer is the tenant's "issuer" setting, not something discovered. It is set to the URL of the identity
# provider itself (the kickstart does it), so OIDC libraries such as Auth.js can validate that the issuer
# announced by /.well-known/openid-configuration equals the address they fetched it from. Change both together.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${FUSIONAUTH_JWKS_URI:http://localhost:9011/.well-known/jwks.json}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${FUSIONAUTH_ISSUER:http://127.0.0.1:9011}
# Audience = id of the FusionAuth application (same value as in fusionauth/kickstart/kickstart.json)
spring.security.oauth2.resourceserver.jwt.audiences=${FUSIONAUTH_APPLICATION_ID:c2f6a1b4-3d5e-4f70-8a9b-6e1d2c3b4a59}

# Public address of the client app that QR codes point to (https in production)
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:3000}

# Browser origins allowed to call the API (comma separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management.endpoints.web.exposure.include=health,info

# ---------------------------------------------------------------------------------------------
# YouTube Data API v3 (catalog). Without a key the catalog answers 503 CATALOG_NOT_CONFIGURED and the
# rest of the application keeps working. search.list costs 100 quota units, videos.list costs 1, and the
# default free quota is 10,000 units per day, so results are cached and usage is counted.
app.youtube.api-key=${YOUTUBE_API_KEY:}
app.youtube.base-url=${YOUTUBE_BASE_URL:https://www.googleapis.com/youtube/v3}
app.youtube.timeout-seconds=5
app.youtube.region-code=CO
app.youtube.relevance-language=es
app.youtube.max-results=15
# Stop calling the provider when this many units were used today (leaves headroom under the 10,000 quota)
app.youtube.daily-quota-limit=9000
# Provider metadata kept in our database is revalidated after this many days (provider policy: 30 at most)
app.youtube.metadata-ttl-days=7
# How long an identical search is answered from memory
app.youtube.search-cache-minutes=60

# ---------------------------------------------------------------------------------------------
# Search-as-you-type suggestions (/api/*/catalogo/sugerencias): known songs plus YouTube's suggest endpoint.
# UNOFFICIAL, CAN BREAK WITHOUT NOTICE: suggestqueries.google.com is undocumented. It costs no Data API quota,
# carries only the query and the language, and any failure just drops the remote part of the answer.
app.suggestions.youtube.enabled=true
app.suggestions.youtube.base-url=https://suggestqueries.google.com/complete/search
app.suggestions.youtube.timeout-millis=1500
app.suggestions.youtube.cache-minutes=60
# Outgoing calls per second; over it the remote is skipped for that request
app.suggestions.youtube.max-calls-per-second=10
# Consecutive failures that stop the remote calls for cooldown-minutes
app.suggestions.youtube.failure-threshold=5
app.suggestions.youtube.cooldown-minutes=10

# Participants (anonymous clients that scan the establishment QR)
# Upper bound of a participant credential; it also dies the moment its session closes.
app.participante.credential-ttl-hours=24
# Search-as-you-type requests per participant per minute
app.participante.suggestions-per-minute=60
# Version of the privacy policy a participant must accept before joining (F1)
app.privacy.policy-version=1.0

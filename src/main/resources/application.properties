spring.application.name=yousong-backend

# Load local secrets from .env (git-ignored); real environment variables still win
spring.config.import=optional:file:.env[.properties]

# Database (override with environment variables; defaults match docker-compose.yml)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the schema; Hibernate only validates it
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Instants are stored in UTC; the UI renders America/Bogota
spring.jackson.time-zone=UTC

# JWT (never commit a real secret; set JWT_SECRET in each environment)
app.security.jwt.secret=${JWT_SECRET}

management.endpoints.web.exposure.include=health,info

# Tests never reach the real YouTube API, even when YOUTUBE_API_KEY is exported or set in .env.
# Classes that need the catalog set app.youtube.* themselves (see YoutubeApiTest).
app.youtube.api-key=

# Every API test calls from 127.0.0.1 inside one JVM, so the production join limits would throttle them.
# Classes that test the limits set small values themselves (see UnirseLimitePorDireccionApiTest).
app.participante.join-per-minute-per-address=100000
app.participante.join-per-minute-per-establishment=100000
app.participante.max-per-session=100000

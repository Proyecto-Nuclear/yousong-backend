# Tests never reach the real YouTube API, even when YOUTUBE_API_KEY is exported or set in .env.
# Classes that need the catalog set app.youtube.* themselves (see YoutubeApiTest).
app.youtube.api-key=

# Every API test calls from 127.0.0.1 inside one JVM, so the production join limits would throttle them.
# Classes that test the limits set small values themselves (see UnirseLimitePorDireccionApiTest).
app.participante.join-per-minute-per-address=100000
app.participante.join-per-minute-per-establishment=100000
app.participante.max-per-session=100000

# Tests never reach the real (unofficial) YouTube suggest endpoint; classes that need it point it at a local server.
app.suggestions.youtube.base-url=http://127.0.0.1:9/complete/search

# Queue actions (requests and votes) per participant per minute; classes that test the limit set it themselves.
app.participante.queue-actions-per-minute=100000

# The scheduled close (CierrePorHorario) must not run on its own in tests: every Spring context of the suite shares
# one database, so a real-time tick could close sessions another test class is using. Tests call the tick directly.
app.schedule.tick-seconds=86400

# Owner catalog routes are limited per establishment and establishment creation per client address; every API test
# calls from 127.0.0.1 inside one JVM, so classes that test those limits set the production values themselves
# (see PropietarioLimitesApiTest).
app.propietario.search-per-minute=100000
app.propietario.suggestions-per-minute=100000
app.propietario.create-per-hour-per-address=100000

# Every Spring context of the suite keeps its own pool against the one embedded PostgreSQL. Hikari's default keeps
# maximum-pool-size (10) connections open per context even when idle, which passes the server's connection limit
# once the suite has many contexts; open connections only on demand instead (the maximum stays 10).
spring.datasource.hikari.minimum-idle=1

# APK download page: the APK with its Android MIME type, nothing cached (it changes when the IP changes).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    add_header Cache-Control "no-cache" always;

    location = /yousong.apk {
        types { }
        default_type application/vnd.android.package-archive;
        add_header Cache-Control "no-cache" always;
        add_header Content-Disposition 'attachment; filename="yousong.apk"' always;
    }

    location ~ /\. {
        deny all;
    }
}

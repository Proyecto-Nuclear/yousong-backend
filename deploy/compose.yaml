# YouSong presentation deployment. Do not run it by hand: use ./deploy.sh (Linux/macOS) or deploy.ps1 (Windows),
# which create config.env, export WEB_DIR/MOBILE_DIR/DEPLOY_DIR and pass --env-file config.env.
#
# Reachable from the LAN (phones): only the backend API (8080) and the APK download page (DOWNLOAD_PORT, 8000).
# Only on this PC (127.0.0.1): the owner web panel (3000) and FusionAuth (9011). PostgreSQL is not published.
name: yousong

x-db-env: &app-db
  DB_URL: jdbc:postgresql://postgres:5432/yousong
  DB_USER: yousong
  DB_PASSWORD: ${POSTGRES_PASSWORD:?missing in config.env}

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: yousong
      POSTGRES_USER: yousong
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing in config.env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
      TZ: UTC
    volumes:
      - app_db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yousong -d yousong"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  fusionauth-db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${FUSIONAUTH_DB_ROOT_PASSWORD:?missing in config.env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - fusionauth_db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  fusionauth:
    image: fusionauth/fusionauth-app:1.70.2
    depends_on:
      fusionauth-db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://fusionauth-db:5432/fusionauth
      DATABASE_ROOT_USERNAME: postgres
      DATABASE_ROOT_PASSWORD: ${FUSIONAUTH_DB_ROOT_PASSWORD}
      DATABASE_USERNAME: fusionauth
      DATABASE_PASSWORD: ${FUSIONAUTH_DB_PASSWORD:?missing in config.env}
      FUSIONAUTH_APP_MEMORY: 512M
      FUSIONAUTH_APP_RUNTIME_MODE: development
      FUSIONAUTH_APP_URL: http://fusionauth:9011
      SEARCH_TYPE: database
      # Kickstart runs once, against an empty FusionAuth database. Its secrets come from config.env (#{ENV.NAME}).
      FUSIONAUTH_APP_KICKSTART_FILE: /usr/local/fusionauth/kickstart/kickstart.json
      FUSIONAUTH_API_KEY: ${FUSIONAUTH_API_KEY:?missing in config.env}
      FUSIONAUTH_CLIENT_SECRET: ${FUSIONAUTH_CLIENT_SECRET:?missing in config.env}
      FUSIONAUTH_ADMIN_EMAIL: ${FUSIONAUTH_ADMIN_EMAIL:-admin@yousong.local}
      FUSIONAUTH_ADMIN_PASSWORD: ${FUSIONAUTH_ADMIN_PASSWORD:?missing in config.env}
      OWNER_EMAIL: ${OWNER_EMAIL:-propietario@yousong.local}
      OWNER_PASSWORD: ${OWNER_PASSWORD:?missing in config.env}
    ports:
      - "127.0.0.1:9011:9011"
    volumes:
      - ./fusionauth:/usr/local/fusionauth/kickstart:ro
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail http://localhost:9011/api/status -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: deploy/backend/Dockerfile
    image: yousong-backend:local
    depends_on:
      postgres:
        condition: service_healthy
      fusionauth:
        condition: service_healthy
    environment:
      <<: *app-db
      # Keys are fetched inside the compose network; tokens carry the issuer the browser sees.
      FUSIONAUTH_JWKS_URI: http://fusionauth:9011/.well-known/jwks.json
      FUSIONAUTH_ISSUER: http://127.0.0.1:9011
      FUSIONAUTH_APPLICATION_ID: c2f6a1b4-3d5e-4f70-8a9b-6e1d2c3b4a59
      # The app only reads the venue slug from the QR; the web panel lives on this PC.
      PUBLIC_BASE_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail http://localhost:8080/actuator/health -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped

  analytics:
    build:
      context: ../analytics
      target: runtime
    image: yousong-analytics:local
    command: ["loop"]
    depends_on:
      backend:
        condition: service_healthy
    environment:
      ANALYTICS_DB_URL: postgresql://postgres:5432/yousong
      ANALYTICS_DB_USER: yousong
      ANALYTICS_DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Never change it after the first run: a new key publishes the same participations again.
      ANALYTICS_HMAC_KEY: ${ANALYTICS_HMAC_KEY:?missing in config.env}
      ANALYTICS_INTERVAL_SECONDS: 120
    volumes:
      - analytics_parquet:/data/parquet
    restart: unless-stopped

  # Owns the network namespace of the web panel and forwards its loopback to FusionAuth and the backend.
  webnet:
    image: node:24-alpine
    command: ["node", "/forward.mjs"]
    volumes:
      - ./web/forward.mjs:/forward.mjs:ro
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

  web:
    build:
      context: ${WEB_DIR:?use deploy.sh or deploy.ps1}
      dockerfile: ${DEPLOY_DIR:?use deploy.sh or deploy.ps1}/web/Dockerfile
    image: yousong-web:local
    network_mode: service:webnet
    depends_on:
      - webnet
      - backend
    environment:
      AUTH_URL: http://localhost:3000
      AUTH_SECRET: ${AUTH_SECRET:?missing in config.env}
      AUTH_TRUST_HOST: "true"
      FUSIONAUTH_URL: http://127.0.0.1:9011
      FUSIONAUTH_CLIENT_ID: c2f6a1b4-3d5e-4f70-8a9b-6e1d2c3b4a59
      FUSIONAUTH_CLIENT_SECRET: ${FUSIONAUTH_CLIENT_SECRET}
      API_BASE_URL: http://127.0.0.1:8080
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 120s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  # Builds the Android APK for HOST_IP (only when the address or the app source changed) and exits.
  apk:
    build:
      context: ${MOBILE_DIR:?use deploy.sh or deploy.ps1}
      dockerfile: ${DEPLOY_DIR}/apk/Dockerfile
      additional_contexts:
        deploy: ${DEPLOY_DIR}/apk
    image: yousong-apk-builder:local
    environment:
      HOST_IP: ${HOST_IP:?missing in config.env}
      DOWNLOAD_PORT: ${DOWNLOAD_PORT:-8000}
    volumes:
      - android_keystore:/root/.android
      - apk_dist:/dist
    restart: "no"

  download:
    image: nginx:1.27-alpine
    depends_on:
      apk:
        condition: service_completed_successfully
    volumes:
      - apk_dist:/usr/share/nginx/html:ro
      - ./download/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${DOWNLOAD_PORT:-8000}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ./deploy.sh demo: demo owner, venue "La Sala Demo" and its history. Not started by "up".
  demo:
    image: yousong-analytics:local
    profiles: ["demo"]
    entrypoint: ["python", "/demo/seed_demo.py"]
    depends_on:
      backend:
        condition: service_healthy
    environment:
      <<: *app-db
      BACKEND_URL: http://backend:8080
      FUSIONAUTH_URL: http://fusionauth:9011
      FUSIONAUTH_API_KEY: ${FUSIONAUTH_API_KEY}
      FUSIONAUTH_APPLICATION_ID: c2f6a1b4-3d5e-4f70-8a9b-6e1d2c3b4a59
      DEMO_OWNER_EMAIL: ${DEMO_OWNER_EMAIL:-demo@yousong.local}
      DEMO_OWNER_PASSWORD: ${DEMO_OWNER_PASSWORD:?missing in config.env}
    volumes:
      - ./demo:/demo:ro

volumes:
  app_db:
  fusionauth_db:
  analytics_parquet:
  android_keystore:
  apk_dist:

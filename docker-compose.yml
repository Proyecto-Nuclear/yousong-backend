services:
  postgres:
    image: postgres:18
    container_name: nuclear-vii-postgres
    environment:
      POSTGRES_DB: nuclear_vii
      POSTGRES_USER: nuclear
      POSTGRES_PASSWORD: nuclear
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - nuclear_vii_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nuclear -d nuclear_vii"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Identity provider (FusionAuth Community, self-hosted). It has its own database so it never
  # shares data or credentials with the application database. Development credentials only.
  fusionauth-db:
    image: postgres:18
    container_name: nuclear-vii-fusionauth-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - fusionauth_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  fusionauth:
    image: fusionauth/fusionauth-app:1.70.2
    container_name: nuclear-vii-fusionauth
    depends_on:
      fusionauth-db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://fusionauth-db:5432/fusionauth
      DATABASE_ROOT_USERNAME: postgres
      DATABASE_ROOT_PASSWORD: postgres
      DATABASE_USERNAME: fusionauth
      DATABASE_PASSWORD: fusionauth
      FUSIONAUTH_APP_MEMORY: 512M
      FUSIONAUTH_APP_RUNTIME_MODE: development
      FUSIONAUTH_APP_URL: http://fusionauth:9011
      SEARCH_TYPE: database
      # Kickstart only runs on the first start, against an empty FusionAuth database.
      # It enables self-service registration (application registrationConfiguration: basic, email login):
      # an establishment owner signs up from the hosted login page ("Create an account") and gets no role.
      # Dev only: neither email nor registration verification is required because there is no SMTP here.
      # Production must configure SMTP and turn on email verification (tenant) and/or registration
      # verification (application, unverified behavior "Gated") so unverified accounts cannot sign in.
      FUSIONAUTH_APP_KICKSTART_FILE: /usr/local/fusionauth/kickstart/kickstart.json
    ports:
      # Loopback only: the kickstart API key is a development superuser key.
      - "127.0.0.1:9011:9011"
    volumes:
      - ./fusionauth/kickstart:/usr/local/fusionauth/kickstart:ro
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail http://localhost:9011/api/status -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  nuclear_vii_data:
  fusionauth_db_data:

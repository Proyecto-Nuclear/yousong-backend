services:
  postgres:
    image: postgres:18
    container_name: nuclear-vii-postgres
    environment:
      POSTGRES_DB: nuclear_vii
      POSTGRES_USER: nuclear
      POSTGRES_PASSWORD: nuclear
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - nuclear_vii_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nuclear -d nuclear_vii"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  nuclear_vii_data:
